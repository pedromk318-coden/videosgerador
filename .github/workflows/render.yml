name: Render uploaded video project
on:
  push:
    paths:
      - "projects/*.json"
  workflow_dispatch:
    inputs:
      render_mode:
        description: "Render mode: preview, normal or cinematic"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - normal
          - cinematic
      project_file:
        description: "Caminho do arquivo JSON dentro de projects/"
        required: true
        default: "projects/projeto-5-metros-de-altura.json"
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select project file
        id: project
        shell: bash
        env:
          REQUESTED_PROJECT: ${{ inputs.project_file }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.render_mode }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            mapfile -t files < <(find projects -maxdepth 1 -type f -name '*.json' ! -name 'modelo-projeto.json' | sort)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Foram encontrados ${#files[@]} projetos. Mantenha um projeto por vez ou execute manualmente escolhendo o arquivo."
              printf '%s\n' "${files[@]}"
              exit 1
            fi
            selected="${files[0]}"
          else
            selected="$REQUESTED_PROJECT"
          fi
          case "$selected" in projects/*.json) ;; *) echo "O arquivo deve ficar dentro de projects/ e terminar em .json"; exit 1;; esac
          test -f "$selected" || { echo "Arquivo não encontrado: $selected"; exit 1; }
          echo "Projeto selecionado: $selected"
          echo "path=$selected" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ]; then mode="preview"; else mode="$REQUESTED_MODE"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender libegl1 libgl1 libgl1-mesa-dri libgles2 libxrender1 libxext6 libsm6
          python -m pip install -r requirements.txt
      - name: Validate project and prepare scenes
        run: python src/project_validator.py --input "${{ steps.project.outputs.path }}" --output scenes.json
      - name: Verify Blender headless runtime
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: "surfaceless"
        run: blender -b -t 2 --python-expr "import bpy; print('Blender headless OK:', bpy.app.version_string)"
      - name: Render animation without AI
        env:
          RENDER_MODE: ${{ steps.project.outputs.mode }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: "surfaceless"
        run: blender -b -t 2 --python src/blender_engine.py -- --input scenes.json --output output/video.mp4
      - name: Verify rendered frames
        run: |
          test -d output/frames
          test -n "$(find output/frames -maxdepth 1 -type f -name 'frame_*.png' -print -quit)" || { echo "Blender não gerou quadros PNG"; exit 1; }
      - name: Assemble MP4 with FFmpeg
        run: |
          mkdir -p output
          FPS=$(python -c "import json; print(int(json.load(open('scenes.json')).get('fps',24)))")
          PRESET=medium
          CRF=21
          if [ "${{ steps.project.outputs.mode }}" = "preview" ]; then PRESET=ultrafast; CRF=26; elif [ "${{ steps.project.outputs.mode }}" = "cinematic" ]; then PRESET=slow; CRF=18; fi
          ffmpeg -hide_banner -loglevel error -y -framerate "$FPS" -i output/frames/frame_%04d.png -c:v libx264 -preset "$PRESET" -crf "$CRF" -pix_fmt yuv420p -movflags +faststart output/video.mp4
          test -s output/video.mp4
      - name: Generate subtitles
        run: python src/subtitles.py --input scenes.json --output output/subtitles.srt
      - name: Add ambient audio
        run: python src/audio_engine.py --input scenes.json --video output/video.mp4 --output output/video_with_audio.mp4
      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: video-completo
          path: output/
          if-no-files-found: error
