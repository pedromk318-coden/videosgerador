name: Render video
on:
  workflow_dispatch:
    inputs:
      output_name:
        description: Nome do MP4 gerado
        required: false
        default: video.mp4
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Render
        run: python src/render.py --input scenes.json --output output/video.mp4
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/*.mp4
          if-no-files-found: error
