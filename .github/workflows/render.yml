name: Render video
on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Descreva o vídeo que deseja gerar"
        required: true
        type: string
      scene_count:
        description: "Quantidade de cenas (1 a 10)"
        required: true
        default: "6"
        type: string
      scene_duration:
        description: "Duração de cada cena em segundos"
        required: true
        default: "10"
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Create scene outline from idea
        env:
          VIDEO_IDEA: ${{ inputs.idea }}
          SCENE_COUNT: ${{ inputs.scene_count }}
          SCENE_DURATION: ${{ inputs.scene_duration }}
        run: python src/idea_to_scenes.py --idea "$VIDEO_IDEA" --count "$SCENE_COUNT" --duration "$SCENE_DURATION" --output scenes.json
      - name: Render
        run: python src/render.py --input scenes.json --output output/video.mp4
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/*.mp4
          if-no-files-found: error
