name: Render video from complete script
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Cole aqui o roteiro completo da história"
        required: true
        type: string
      genre:
        description: "Clima visual"
        required: true
        default: "cinematográfico"
        type: choice
        options: [cinematográfico, fantasia, aventura, mistério, drama, ficção científica]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Build scenes and timings from script
        env:
          VIDEO_SCRIPT: ${{ inputs.script }}
          VIDEO_GENRE: ${{ inputs.genre }}
        run: |
          printf '%s' "$VIDEO_SCRIPT" > roteiro.txt
          python src/idea_to_scenes.py --script-file roteiro.txt --genre "$VIDEO_GENRE" --output scenes.json
      - name: Render video
        run: python src/render.py --input scenes.json --output output/video.mp4
      - name: Generate subtitles
        run: python src/subtitles.py --input scenes.json --output output/subtitles.srt
      - name: Add ambient audio
        run: python src/audio_engine.py --input scenes.json --video output/video.mp4 --output output/video_with_audio.mp4
      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: video-completo
          path: output/
          if-no-files-found: error
