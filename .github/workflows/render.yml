name: Render video with procedural engine
on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Ideia/tema do vídeo"
        required: true
        type: string
      scene_count:
        description: "Quantidade de cenas"
        required: true
        default: "6"
        type: string
      scene_duration:
        description: "Segundos por cena"
        required: true
        default: "10"
        type: string
      genre:
        description: "Gênero/estilo da história"
        required: true
        default: "mistério"
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Create scene script from idea
        env:
          VIDEO_IDEA: ${{ inputs.idea }}
          SCENE_COUNT: ${{ inputs.scene_count }}
          SCENE_DURATION: ${{ inputs.scene_duration }}
          VIDEO_GENRE: ${{ inputs.genre }}
        run: python src/idea_to_scenes.py --idea "$VIDEO_IDEA" --count "$SCENE_COUNT" --duration "$SCENE_DURATION" --genre "$VIDEO_GENRE" --output scenes.json
      - name: Render video
        run: python src/render.py --input scenes.json --output output/video.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/*.mp4
          if-no-files-found: error
