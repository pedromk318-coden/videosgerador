<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideosGerador</title><style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f5f7fb;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:20px}.app{width:min(680px,100%);background:#1a202b;border:1px solid #303a4b;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0005}h1{margin:0 0 6px}p{color:#aeb9c9}label{display:block;margin:16px 0 8px;font-weight:600}textarea,input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #3a4659;background:#111722;color:#fff;font:inherit}textarea{min-height:130px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{margin-top:18px;padding:13px 16px;border:0;border-radius:10px;background:#6c8cff;color:#0b1020;font-weight:800;font-size:16px;width:100%;cursor:pointer}#status{margin-top:14px;white-space:pre-wrap;color:#b9c8dc}.note{font-size:13px;color:#94a3b8}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>🎬 VideosGerador</h1><p>Descreva o vídeo que você quer. Prepare a ideia para renderização.</p><label for="idea">Sua ideia</label><textarea id="idea" placeholder="Ex.: Um explorador encontra uma cidade esquecida dentro da floresta..."></textarea><div class="grid"><div><label for="scenes">Quantidade de cenas</label><select id="scenes"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></div><div><label for="duration">Segundos por cena</label><select id="duration"><option selected>10</option><option>15</option><option>20</option></select></div></div><button id="make">Preparar roteiro JSON</button><div id="status"></div><p class="note">Esta primeira interface cria um roteiro estruturado simples. A geração de roteiro por IA e imagens será adicionada em uma próxima etapa.</p></main><script>
const idea=document.getElementById('idea'),status=document.getElementById('status');
document.getElementById('make').onclick=()=>{const text=idea.value.trim();if(!text){status.textContent='Digite uma ideia antes de continuar.';return;}const n=Number(document.getElementById('scenes').value),d=Number(document.getElementById('duration').value);
const beats=['A história começa: apresente o cenário e o personagem.','Um detalhe estranho chama a atenção e cria curiosidade.','O personagem se aproxima e descobre uma pista inesperada.','A situação muda e surge um novo mistério.','A descoberta revela uma parte surpreendente da história.','O momento decisivo conecta as pistas anteriores.','Uma última surpresa muda a interpretação dos acontecimentos.','A história termina com uma imagem marcante e espaço para reflexão.','Um novo elemento aparece, sugerindo que há mais por descobrir.','Finalize com um gancho intrigante.'];
const scenes=Array.from({length:n},(_,i)=>({duration:d,title:'Cena '+(i+1),text:text+' '+beats[i%beats.length],background:i%2===0?['#0b1e35','#34526e']:['#17132d','#533a6e']}));
const json={title:text,format:'9:16',fps:24,resolution:{width:720,height:1280},scenes};const blob=new Blob([JSON.stringify(json,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='scenes.json';a.click();URL.revokeObjectURL(a.href);status.textContent='Roteiro scenes.json preparado e baixado. Envie esse arquivo para o repositório e execute Actions → Render video.';};
</script></body></html>
